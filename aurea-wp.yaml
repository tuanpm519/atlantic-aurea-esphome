    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 10
  - platform: wifi_signal
    name: ${name} WiFi Signal
    update_interval: 120s
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 11

binary_sensor:
  # ── Extra statuses from the outdoor unit (byte map by WackoH) ──
  - platform: template
    name: "Defrost active"
    lambda: |-
      const int v = id(wp)->get_defrost_flag();
      if (v < 0) return {};
      return v != 0;
    icon: mdi:snowflake-melt
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 50

  - platform: template
    name: "Defrost per ID3"
    lambda: |-
      const int v = id(wp)->get_status8();
      if (v < 0) return {};
      return (v & 0x01) != 0;
    icon: mdi:snowflake-melt
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 61

  - platform: template
    name: "Running"
    lambda: 'return id(wp)->get_running();'
    device_class: running
    web_server:
      sorting_group_id: grp_wp
      sorting_weight: 8

  # Defrost - derived, not from the protocol (the real defrost byte has not been
  # found yet). During defrost the four-way valve reverses and the unit takes
  # heat OUT of the water: the supply drops below the return, which does not
  # happen otherwise. When cooling that is normal, so then always off. The 30 s
  # delay absorbs the mixing transient right after switching off.
  - platform: template
    name: "Defrost (derived)"
    device_class: running
    icon: mdi:snowflake-melt
    lambda: |-
      if (id(wp)->get_cooling()) return false;
      const float dt = id(wp)->get_delta_t();
      if (std::isnan(dt)) return false;
      return dt < -1.0f;
    filters:
      - delayed_on: 30s
      - delayed_off: 60s
    web_server:
      sorting_group_id: grp_wp
      sorting_weight: 9

  - platform: template
    name: "Room temperature received"
    lambda: 'return id(wp)->get_room_fresh();'
    device_class: connectivity
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 3

  - platform: template
    name: "Communication"
    lambda: 'return id(wp)->get_comm_ok();'
    device_class: connectivity
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 3

text_sensor:
  # Why the control does what it does: "stooklijn", "boven de stookgrens",
  # "kamertemperatuur ontbreekt of is verlopen - unit uit", etc.
  # (these reason texts come from chofu_wp.cpp; they are in English there only
  # if you translated that file too).
  - platform: template
    name: "Control status"
    lambda: 'return std::string(id(wp)->get_reason());'
    update_interval: 10s
    icon: mdi:information-outline
    web_server:
      sorting_group_id: grp_regeling
      sorting_weight: 7

  - platform: version
    name: ${name} ESPHome Version
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 12
  - platform: wifi_info
    ip_address:
      name: ${name} IP
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 13
    ssid:
      name: ${name} SSID
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 14
    bssid:
      name: ${name} BSSID
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 15

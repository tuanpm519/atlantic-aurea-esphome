    icon: mdi:sine-wave
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 40

  - platform: template
    name: "Outdoor unit current"
    lambda: 'return id(wp)->get_current();'
    update_interval: 10s
    unit_of_measurement: "A"
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:current-ac
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 41

  - platform: template

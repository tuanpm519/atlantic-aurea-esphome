# ═══════════════════════════════════════════════════════════════════════════
#  Aurea WP - MINIMAL SETUP (example) - English translation
#
#  Only an ESP32 in the IC1 socket. The IC2 socket stays empty: no own
#  ATmega328P, no OpenTherm bridge. The heat pump does everything it also does
#  in the full setup; you control your central-heating boiler separately, as before.
#
#  USAGE: copy this file over aurea-wp.yaml.
#
#      cp aurea-wp-minimaal.yaml.example aurea-wp.yaml
#      esphome run aurea-wp.yaml
#
#  This way there is always exactly one active config with that name, which is
#  what you want: ESPHome picks its build folder from the device name. Two files
#  that are both called `aurea-wp` share that folder, and then one build trips
#  over the leftovers of the other.
#
#  Choose this setup if:
#   - you have not yet burned a 328P, or are not ready for it;
#   - you have no central-heating boiler connected to the control box at all;
#   - something is wrong with the bridge and you still want to run the heat pump.
#
#  Going back to the full setup is `git checkout aurea-wp.yaml` followed by
#  `esphome clean aurea-wp.yaml`. The device name stays the same, so Home
#  Assistant keeps the device and the history of all sensors that appear in
#  both; you gain the thermostat and boiler entities.
#
#  Wiring: see WIRING.md. For this setup you only need GPIO16/17 and the
#  power supply - you may skip the divider on GPIO19.
#
#  Board: AZ-Delivery D1 mini ESP32 (ESPHome board: wemos_d1_mini32). Wire by
#  GPIO number, not by the D-labels on the silkscreen.
#  Names and comments translated to English; the mode select options are
#  matched in the lambda below.
# ═══════════════════════════════════════════════════════════════════════════

substitutions:
  name: "aurea-wp"
  friendly_name: Aurea Heat Pump

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

# Only chofu_wp is needed; aurea_link stays unused.
external_components:
  - source:
      type: local
      path: components
    components: [chofu_wp]

# ─────────────────────────────────────────────────────────────────
#  Hardware UART to the heat pump control box (via the 2x H11D1 opto-couplers)
#  666 baud, 8N1 - outdoor unit is master. See README.md for wiring.
#  RX (GPIO16) <- pin 27 (from heat pump), via R9 (4k7) + 10k to GND.
#  TX (GPIO17) -> pin 26 (to heat pump), directly on the driver stage.
# ─────────────────────────────────────────────────────────────────
uart:
  id: wp_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 666

chofu_wp:
  id: wp
  uart_id: wp_uart
  update_interval: 5s   # Control cycle
  # Almost everything is set from the web page or Home Assistant (group
  # "Settings"). These are the fixed limits:
  # dt_low: 4.0          # lower edge of the healthy delta-T band (°C)
  # setpoint_min: 6.5    # range of the supply setpoint (Chofu datasheet)
  setpoint_max: 42.0     # was 60: efficiency guard
  # cooling_min_supply: 5.0  # frost protection when cooling

logger:

# Native API for Home Assistant.
#
# By default ESPHome reboots the device if no API client has been connected
# for 15 minutes. Without Home Assistant (operation via the web page, or HA is
# down for a moment) it would then reboot every quarter of an hour - the web
# page does not count as a client. That is why this watchdog is disabled here.
# A stuck wifi is already caught by the wifi watchdog (it reboots after 15 min
# without a network).
api:
  encryption:
    key: !secret api_encryption
  reboot_timeout: 0s

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name}_Hotspot"
    password: !secret fallback_password

captive_portal:

# The web page at http://aurea-wp.local - also works without Home Assistant.
# Version 3 with groups: the group says what something belongs to, so the
# names no longer have to.
web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: grp_regeling
      name: "Control"
      sorting_weight: 10
    - id: grp_wp
      name: "Heat pump"
      sorting_weight: 20
    - id: grp_stooklijn
      name: "Heating curve and room temperature"
      sorting_weight: 30
    - id: grp_instellingen
      name: "Settings"
      sorting_weight: 40
    - id: grp_diag
      name: "Diagnostics"
      sorting_weight: 50

# Time from the network, not from Home Assistant: so it also works without.
time:
  - platform: sntp
    id: sntp_time

# Status LED on GPIO2. (The original used the blue on-board LED of the MH-ET MiniKit;
# check whether your board has an LED on GPIO2 - it is harmless if not.)
status_led:
  pin:
    number: GPIO2

# ═══════════════════════════════════════════════════════════════
#  CONTROL
# ═══════════════════════════════════════════════════════════════
#
# The heat pump is always given a desired SUPPLY temperature and picks the
# stage itself. Where that temperature comes from is determined by the mode:
#
#   fixed setpoint    "Supply setpoint", constant.
#   heating curve     From the outdoor temperature (the sensor on the outdoor
#                     unit), using the two heating curve points. Above the
#                     heating limit there is no heat demand.
#   room temperature  The heating curve, plus a correction based on a room
#                     temperature that you supply (see "Room temperature
#                     external"). Without a fresh room temperature the unit
#                     goes OFF.
#   manual            No control: a fixed stage ("Manual stage").
#
# Cooling always uses the fixed setpoint, also in heating curve / room temperature mode.

select:
  - platform: template
    name: "Mode"
    id: sel_modus
    options: ["fixed setpoint", "heating curve", "room temperature", "manual"]
    initial_option: "fixed setpoint"
    optimistic: true
    restore_value: true
    icon: mdi:refresh-auto
    on_value:
      then:
        - lambda: |-
            using esphome::chofu_wp::ChofuWP;
            if (x == "heating curve") id(wp)->set_mode(ChofuWP::MODE_CURVE);
            else if (x == "room temperature") id(wp)->set_mode(ChofuWP::MODE_ROOM);
            else if (x == "manual") id(wp)->set_mode(ChofuWP::MODE_MANUAL);
            else id(wp)->set_mode(ChofuWP::MODE_AUTO);
    web_server:
      sorting_group_id: grp_regeling
      sorting_weight: 2

number:
  # ── Control ──

  # "Give me constant water at X °C" (fixed setpoint mode, and always when cooling).
  - platform: template
    name: "Supply setpoint"
    id: n_setpoint
    # Full technical range from the Chofu datasheet (AEYC-0643XU):
    # leaving water temperature -> cooling 6.5°C~ , heating ~60°C
    min_value: 6.5
    max_value: 60
    step: 0.5
    initial_value: 35
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-water
    on_value:
      then:
        - lambda: 'id(wp)->set_setpoint(x);'
    web_server:
      sorting_group_id: grp_regeling
      sorting_weight: 3

  # Manual override: set the stage yourself (only works in "manual" mode).
  - platform: template
    name: "Manual stage"
    id: n_manual_stand
    min_value: 0
    max_value: 10
    step: 1
    initial_value: 1
    optimistic: true
    mode: slider
    icon: mdi:gauge
    on_value:
      then:
        - lambda: 'id(wp)->set_manual_stand((int) x);'
    web_server:
      sorting_group_id: grp_regeling
      sorting_weight: 4

  # ── Heating curve and room temperature ──

  # The room temperature for room temperature mode. You have to supply this
  # yourself, with a sensor of your choice, and REGULARLY: even if it does not change.
  # If it stays away longer than the timeout, the unit switches off.
  #
  #   Home Assistant: an automation that calls number.set_value on every
  #                   change of your sensor and also every 5 minutes
  #                   (example in the README).
  #   Without HA:     POST http://aurea-wp.local/number/Room%20temperature%20external/set?value=20.5
  #                   (from Node-RED, Domoticz, a script, ...).
  - platform: template
    name: "Room temperature external"
    id: n_room_temp
    min_value: -10
    max_value: 40
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:home-thermometer
    # set_action and not on_value: on_value only fires on a CHANGE,
    # and a room that stays the same must also count as fresh.
    set_action:
      - lambda: |-
          id(wp)->set_room_temp(x);
          id(n_room_temp)->publish_state(x);
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 1

  - platform: template
    name: "Room target temperature"
    id: n_room_target
    min_value: 5
    max_value: 30
    step: 0.5
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:home-thermometer-outline
    on_value:
      then:
        - lambda: 'id(wp)->set_room_target(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 2

  # How many degrees of supply temperature to add (or remove) per degree that the
  # room is too cold (or too warm). Like the room influence of an Anna or Remeha.
  - platform: template
    name: "Room influence"
    id: n_room_gain
    min_value: 0
    max_value: 15
    step: 0.5
    initial_value: 3        # was 4
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C/°C"
    mode: box
    icon: mdi:home-import-outline
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_room_gain(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 4

  # Hysteresis for "Off when the room is warm": switches off as soon as the room temperature exceeds the target by a certain amount,
  # and switches back on once it drops below the target by that same amount. Independently adjustable (idea from _JGC_, Tweakers).
  - platform: template
    name: "Room: above target"
    id: n_room_hyst_off
    min_value: 0
    max_value: 1
    step: 0.1
    initial_value: 0.2
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-chevron-up
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_room_hyst_off(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 6.1

  - platform: template
    name: "Room: below target"
    id: n_room_hyst_on
    min_value: 0
    max_value: 1
    step: 0.1
    initial_value: 0.2
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-chevron-down
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_room_hyst_on(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 6.2

  # Minimum switching time for "Off when the room is warm": after the room triggers a switch-off or switch-on,
  # that state is maintained for at least this duration. Prevents rapid cycling (chattering) caused by cooking or appliances. 0 = disabled (previous behavior).
  - platform: template
    name: "Room: minimum switching time"
    id: n_room_min_hold
    min_value: 0
    max_value: 120
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_room_min_hold((uint32_t) (x * 60000.0f));'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 6.3

  # Room influence alone always stays a little off target. The trim adds
  # this many degrees of supply temperature per minute per degree of error, until
  # the room gets there (limited to -8 .. +12). 0 = off. Start small, e.g. 0.1.
  - platform: template
    name: "Room trim"
    id: n_room_ki
    min_value: 0
    max_value: 1
    step: 0.005             # was 0.05: too coarse for the useful range
    initial_value: 0.03     # was 0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C/°C·min"
    mode: box
    icon: mdi:sigma
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_room_integral(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 5

  # How long a room temperature stays valid without a new value.
  - platform: template
    name: "Room temperature timeout"
    id: n_room_timeout
    min_value: 5
    max_value: 240
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_room_timeout((uint32_t) (x * 60000));'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 7

  # The heating curve: two points, a straight line between them, constant outside.
  # Radiators: roughly 50-55 at -10 and 30-35 at +15.
  # Underfloor heating: roughly 35 at -10 and 25 at +15.
  - platform: template
    name: "Heating curve supply at -10 °C"
    id: n_curve_cold
    min_value: 20
    max_value: 60
    step: 0.5
    initial_value: 48.5     # was 50; now the supply at -10 °C for a room target of "Curve reference"
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:snowflake-thermometer
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_curve_cold(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 10

  - platform: template
    name: "Heating curve supply at +15 °C"
    id: n_curve_warm
    min_value: 20
    max_value: 60
    step: 0.5
    initial_value: 26       # was 30; supply at +15 °C for a room target of "Curve reference"
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:sun-thermometer-outline
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_curve_warm(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 11

  # Above this outdoor temperature there is no heat demand (summer mode). Back on
  # when it is 1 °C colder.
  - platform: template
    name: "Outdoor heating limit"
    id: n_heat_limit
    min_value: 5
    max_value: 30
    step: 0.5
    initial_value: 18
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:weather-sunny-alert
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_heating_limit(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 12

  # ── NEW: parallel shift of the heating curve with the room target ──
  # supply = curve(outdoor) + shift * (room target - reference)
  - platform: template
    name: "Curve shift"
    id: n_curve_shift
    min_value: 0
    max_value: 4
    step: 0.1
    initial_value: 1.9
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C/°C"
    mode: box
    icon: mdi:arrow-up-down
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_curve_shift(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 13

  - platform: template
    name: "Curve reference"
    id: n_curve_ref
    min_value: 15
    max_value: 25
    step: 0.5
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:home-thermometer-outline
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_curve_ref(x);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 14

  # ── Control settings ──

  # How fast the control may step up: at most +1 stage per interval.
  # Long (120 s) = calm, compressor-friendly when heating.
  # Short (30-45 s) = brisk, useful when cooling where the slowness works against you.
  # From standstill to stage 1 it never waits longer than 60 s.
  - platform: template
    name: "Step interval"
    id: n_step_interval
    min_value: 10
    max_value: 600
    step: 5
    initial_value: 360      # was 120: the water loop needs 15-20 min to settle
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    icon: mdi:timer-cog-outline
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_step_interval((uint32_t) (x * 1000));'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 1

  # Stopping (stage 1 -> 0) while there is heat demand: the control must want to
  # stop for this long in a row, and there must be no prediction that it would have to restart
  # immediately (see chofu_wp.cpp). This keeps the compressor running at the lowest stage instead
  # of cycling on/off after a small overshoot. 0 = as before (stop after the normal step interval).
  - platform: template
    name: "Stop delay"
    id: n_stop_delay
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-stop-outline
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_stop_delay((uint32_t) (x * 60000.0f));'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 3

  # Stepping down above stage 1 does not have to wait the full step interval:
  # down is the safe side. Stopping (1 -> 0) does keep the normal interval.
  - platform: template
    name: "Step interval down"
    id: n_down_interval
    min_value: 10
    max_value: 300
    step: 5
    initial_value: 240      # was 30
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    icon: mdi:timer-cog-outline
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_down_interval((uint32_t) (x * 1000));'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 2

  # A ceiling on the stage. The original has stages 1 to 10 (a telegram
  # table in the Atlantic firmware), but that is NOT proven for every
  # outdoor unit. Raise it step by step and see whether "Power" and
  # "Compressor" rise along; if they stay flat, your unit does not pick up
  # the higher stages. Also handy to keep the unit quieter at night.
  - platform: template
    name: "Maximum stage"
    id: n_max_stand
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 4        # was 10
    optimistic: true
    restore_value: true
    mode: slider
    icon: mdi:speedometer-slow
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_max_stand((int) x);'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 3

  # Below the setpoint, do not step up above this delta T; around the setpoint,
  # step down above it. A large delta T is fine as long as the heat can go
  # somewhere; setting it high (e.g. 20) = practically off.
  - platform: template
    name: "Delta-T limit"
    id: n_dt_high
    min_value: 4
    max_value: 30
    step: 0.5
    initial_value: 8
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-lines
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_dt_high(x);'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 4

  # The control looks at the average of supply and return over this many
  # seconds. With the compressor running the supply saws about 3-4 °C every
  # minute; a single measurement at the moment of a step is then chance.
  # 0 = raw values. Maximum 200.
  - platform: template
    name: "Supply averaging window"
    id: n_avg_window
    min_value: 0
    max_value: 200
    step: 10
    initial_value: 200      # was 120
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    icon: mdi:chart-bell-curve
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_avg_window(x);'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 5

  # Lookahead. The compressor takes effect slowly: at stage 3-4 the supply
  # rises 1-2 °C per minute, and waiting until it is above the setpoint is
  # then too late. With this number of minutes the supply is judged as it is
  # expected to be: if it gets there by itself, do not add another stage; if
  # it overshoots by a wide margin, step back a stage earlier. Only from stage 2. 0 = off.
  - platform: template
    name: "Supply lookahead time"
    id: n_lookahead
    min_value: 0
    max_value: 5
    step: 0.5
    initial_value: 3        # was 2
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    mode: box
    icon: mdi:chart-timeline-variant
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_lookahead(x);'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 6

  # Do not step up as long as the supply has risen more than this in the last
  # 5 minutes: the previous step is then still taking effect. 0 = off.
  - platform: template
    name: "Step-up rise limit"
    id: n_rise_limit
    min_value: 0
    max_value: 5
    step: 0.1
    initial_value: 1.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C/5min"
    mode: box
    icon: mdi:chart-line-variant
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_rise_limit(x);'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 7

  # The target moves towards MORE demand by at most this many °C per minute; less
  # demand applies immediately. Without this, a 5 °C jump in the setpoint pushes
  # the unit straight to stage 3-4, and the supply overshoots. 0 = off.
  - platform: template
    name: "Setpoint ramp per minute"
    id: n_sp_slew
    min_value: 0
    max_value: 5
    step: 0.5
    initial_value: 0.5      # was 1
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C/min"
    mode: box
    icon: mdi:slope-uphill
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_setpoint_slew(x);'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 8

  # NEW: dead band around the supply target. The supply ripples by several °C with the
  # compressor running; a band below that makes the stage hunt. Was fixed at 0.3.
  - platform: template
    name: "Supply dead band"
    id: n_band
    min_value: 0.2
    max_value: 3
    step: 0.1
    initial_value: 1.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:arrow-expand-vertical
    entity_category: config
    on_value:
      then:
        - lambda: 'id(wp)->set_band(x);'
    web_server:
      sorting_group_id: grp_instellingen
      sorting_weight: 9

switch:
  # Master on/off. Always back on after a restart.
  - platform: template
    name: "System"
    optimistic: true
    restore_mode: ALWAYS_ON
    icon: mdi:power
    turn_on_action:
      - lambda: 'id(wp)->set_system_on(true);'
    turn_off_action:
      - lambda: 'id(wp)->set_system_on(false);'
    web_server:
      sorting_group_id: grp_regeling
      sorting_weight: 1

  # Cooling mode (data2 byte 4 = 0x02 instead of 0x01), tested on real hardware.
  # After a reboot it is always back on heating. Beware of condensation on
  # uninsulated heating pipes and radiators.
  - platform: template
    name: "Cooling"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    icon: mdi:snowflake
    turn_on_action:
      - lambda: 'id(wp)->set_cooling(true);'
    turn_off_action:
      - lambda: 'id(wp)->set_cooling(false);'
    web_server:
      sorting_group_id: grp_regeling
      sorting_weight: 5

  # Room temperature: unit off as soon as the room is 0.2 °C above the target, back on
  # when it drops 0.2 °C below. Off = the heating curve always applies and
  # only the room influence shifts it (like an Anna).
  - platform: template
    name: "Off when room is warm"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:home-thermometer
    turn_on_action:
      - lambda: 'id(wp)->set_room_off_when_warm(true);'
    turn_off_action:
      - lambda: 'id(wp)->set_room_off_when_warm(false);'
    web_server:
      sorting_group_id: grp_stooklijn
      sorting_weight: 6

  # Diagnostics: turns the raw FRAME hex log on/off (off by default). Handy when
  # fiddling with the wiring; normally leave it off for a clean log.
  - platform: template
    name: "Debug frames"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    icon: mdi:bug
    turn_on_action:
      - lambda: 'id(wp)->set_raw_debug(true);'
    turn_off_action:
      - lambda: 'id(wp)->set_raw_debug(false);'
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 1

button:
  # Erases the stored wifi and all settings and restarts. Afterwards it starts
  # with its own hotspot, like new. Handy before you pass it on.
  - platform: factory_reset
    name: "Factory reset"
    entity_category: config
    icon: mdi:restore-alert
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 30

  - platform: restart
    name: "Restart ${friendly_name}"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 2

# ═══════════════════════════════════════════════════════════════
#  READ-OUT
# ═══════════════════════════════════════════════════════════════


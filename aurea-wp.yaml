    update_interval: 10s
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: grp_wp
      sorting_weight: 6

  - platform: template
    name: "Compressor"
    lambda: 'return id(wp)->get_wp_speed();'  # Speed setpoint as reported by the heat pump
    update_interval: 10s
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sine-wave
    web_server:
      sorting_group_id: grp_wp
      sorting_weight: 7

  # ── Heating curve and room temperature ──
